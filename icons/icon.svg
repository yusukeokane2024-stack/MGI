<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#546E7A"/><stop offset="1" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D673"/><stop offset="1" stop-color="#B8912A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#D4AF37" stroke-opacity=".35" stroke-width="4"/>
  <!-- rising bars -->
  <rect x="136" y="288" width="52" height="88" rx="14" fill="url(#gold)" opacity=".55"/>
  <rect x="230" y="236" width="52" height="140" rx="14" fill="url(#gold)" opacity=".8"/>
  <rect x="324" y="168" width="52" height="208" rx="14" fill="url(#gold)"/>
  <!-- trend line -->
  <path d="M150 250 L256 190 L350 124" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <circle cx="350" cy="124" r="14" fill="#fff"/>
</svg>
